services:
    - type: web
      name: ethara-backend
      runtime: docker
      plan: free
      rootDir: backend
      dockerContext: .
      dockerfilePath: Dockerfile
      healthCheckPath: /health
      autoDeployTrigger: commit
      envVars:
          - key: DATABASE_URL
            fromDatabase:
                name: ethara-postgres
                property: connectionString
          - key: CORS_ORIGINS
            sync: false

databases:
    - name: ethara-postgres
      plan: free
      databaseName: inventory_db
      user: inventory_user
