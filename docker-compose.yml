services:
    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    backend:
        build:
            context: ./backend
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/inventory_db}
        depends_on:
            - db
        ports:
            - "8000:8000"

    frontend:
        build:
            context: ./frontend
            args:
                VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        restart: unless-stopped
        depends_on:
            - backend
        ports:
            - "3000:80"

volumes:
    postgres_data:
